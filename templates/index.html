{% extends "base.html" %}
{% block title %}Add a review{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('index') }}" class="review-form">

  <label for="book_name">Book Name</label>
  <input type="text" id="book_name" name="book_name" list="titles"
         maxlength="200" required value="{{ form.get('book_name', '') }}">
  <datalist id="titles">
    {% for t in titles %}<option value="{{ t }}">{% endfor %}
  </datalist>

  <div class="row">
    <div>
      <label for="genre">Genre</label>
      <select id="genre" name="genre" required>
        <option value="" disabled {{ 'selected' if not form.get('genre') }}>Choose…</option>
        {% for g in genres %}
        <option value="{{ g }}" {{ 'selected' if form.get('genre') == g }}>{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="rating">Rating</label>
      <label for="rating">
        Rating: <output id="rating-value">{{ form.get('rating') or 3 }}</output>/5
      </label>
      <input type="range" id="rating" name="rating"
       min="1" max="5" step="0.5"
       value="{{ form.get('rating') or 3 }}"
       oninput="document.getElementById('rating-value').value = this.value">
    </div>
  </div>

  <label for="review">Review</label>
  <textarea id="review" name="review" rows="5" required>{{ form.get('review', '') }}</textarea>

  <div class="actions">
    <button type="submit" class="btn">Submit</button>
  </div>
</form>
{% endblock %}
